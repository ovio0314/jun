<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ChatGPT 고급 기능 한눈에 보기 — 모션그래픽</title>
<style>
@font-face{font-family:NK;src:url(fonts/nkl-400.woff2);font-weight:400}
@font-face{font-family:NK;src:url(fonts/nkl-700.woff2);font-weight:700}
@font-face{font-family:NK;src:url(fonts/nkl-900.woff2);font-weight:900}
@font-face{font-family:NK;src:url(fonts/nk-400.woff2);font-weight:400}
@font-face{font-family:NK;src:url(fonts/nk-700.woff2);font-weight:700}
@font-face{font-family:NK;src:url(fonts/nk-900.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#090E1C;font-family:NK,sans-serif;color:#EAF0FF;letter-spacing:-0.02em;word-break:keep-all}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;width:1000px;height:1000px;border-radius:50%;filter:blur(140px);opacity:.28}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px);background-size:48px 48px}
.scene{position:absolute;inset:0;opacity:0;display:none}
.abs{position:absolute}
.center{left:0;right:0;text-align:center}
.chip{display:inline-block;padding:12px 28px;border-radius:999px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:30px;font-weight:700;color:#BFD0F5}
.grad{background:linear-gradient(90deg,#4F8CFF,#10C9A0 55%,#7BE07B);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:#93A3C8}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.caret{display:inline-block;width:4px;height:1em;background:currentColor;vertical-align:-0.12em;margin-left:4px}

/* intro */
.t-big{font-size:150px;font-weight:900;line-height:1.05}
.t-mid{font-size:104px;font-weight:900;line-height:1.1}
.sub{font-size:44px;font-weight:700;color:#C9D6F5}
.note{font-size:28px;color:#8392B8}

/* pillars */
.h2{font-size:72px;font-weight:900}
.pillar{position:absolute;top:330px;width:460px;height:470px;border-radius:40px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);text-align:center;padding-top:60px}
.pillar .circ{width:180px;height:180px;border-radius:50%;margin:0 auto 40px;display:flex;align-items:center;justify-content:center}
.pillar .circ svg{width:96px;height:96px}
.pillar .k{font-size:64px;font-weight:900}
.pillar .d{font-size:34px;color:#B5C3E4;margin-top:16px;font-weight:700}

/* feature */
.ftag{left:150px;top:150px;font-size:30px;font-weight:700;color:var(--c);letter-spacing:.05em}
.ficonwrap{left:150px;top:250px;width:300px;height:300px}
.ficon{position:absolute;inset:30px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#0A0F1E;box-shadow:0 0 120px -10px var(--c)}
.ficon svg{width:130px;height:130px;stroke-width:1.9}
.ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--c);opacity:.6}
.fnum{left:150px;top:590px;font-size:200px;font-weight:900;line-height:1;color:rgba(255,255,255,.06)}
.fname{left:150px;top:610px;width:700px;font-size:96px;font-weight:900;line-height:1.1}
.fline{left:950px;top:160px;width:6px;height:760px;background:linear-gradient(var(--c),transparent);transform-origin:top}
.flabel{left:1030px;top:200px;font-size:32px;font-weight:700;color:var(--c)}
.fdesc{left:1030px;top:260px;width:760px;font-size:54px;font-weight:700;line-height:1.38}
.chat{left:1030px;top:560px;width:760px}
.chat .who{font-size:28px;font-weight:700;color:#93A3C8;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.chat .who i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c)}
.bubble{background:#F3F6FF;color:#0E1530;border-radius:36px 36px 8px 36px;padding:36px 44px;font-size:42px;font-weight:700;line-height:1.42;min-height:200px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.dots{left:0;right:0;bottom:70px;display:flex;justify-content:center;gap:18px}
.dots b{display:block;width:16px;height:16px;border-radius:999px;background:rgba(255,255,255,.18)}
.dots b.on{width:56px;background:var(--c)}

/* overview grid */
.tile{position:absolute;width:390px;height:250px;border-radius:30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);padding:34px}
.tile .ti{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:#0A0F1E}
.tile .ti svg{width:46px;height:46px;stroke-width:2.1}
.tile .tn{font-size:38px;font-weight:900;margin-top:26px}
.tile .tk{font-size:25px;color:#9DB0D8;margin-top:8px;font-weight:700}
.summ{position:absolute;top:880px;left:0;right:0;display:flex;justify-content:center;gap:26px}
.summ div{font-size:30px;font-weight:700;padding:14px 30px;border-radius:999px;background:rgba(255,255,255,.07)}
.summ span{font-weight:900}

/* distinctions */
.row{position:absolute;left:230px;width:1460px;height:118px;display:flex;align-items:center;gap:40px;border-radius:28px;background:rgba(255,255,255,.045);padding:0 30px}
.pill{width:330px;flex:none;text-align:center;padding:16px 0;border-radius:999px;font-size:38px;font-weight:900;color:#0A0F1E}
.row .q{font-size:46px;font-weight:700}
.row .q em{font-style:normal;color:#fff}

/* work */
.card{position:absolute;top:290px;width:560px;height:540px;border-radius:40px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);padding:46px 44px;transition:none}
.card.on{border-color:var(--c);background:rgba(255,255,255,.08);box-shadow:0 0 90px -30px var(--c)}
.card .ci{width:96px;height:96px;border-radius:28px;background:var(--c);color:#0A0F1E;display:flex;align-items:center;justify-content:center}
.card .ci svg{width:58px;height:58px;stroke-width:2}
.card .cn{font-size:50px;font-weight:900;margin-top:30px}
.card .tags{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px}
.card .tags span{font-size:26px;font-weight:700;padding:8px 20px;border-radius:999px;border:2px solid var(--c);color:var(--c)}
.card .cq{margin-top:34px;font-size:33px;font-weight:700;line-height:1.5;color:#E3EAFB}

/* prompt tip */
.keys{position:absolute;top:250px;left:0;right:0;display:flex;justify-content:center;gap:28px}
.key{font-size:40px;font-weight:900;padding:18px 40px;border-radius:999px;border:3px solid var(--c);color:var(--c);background:rgba(255,255,255,.03)}
.key.on{background:var(--c);color:#0A0F1E;box-shadow:0 0 60px -10px var(--c)}
.box{position:absolute;left:230px;width:1460px;border-radius:34px;padding:36px 50px}
.box .lb{font-size:30px;font-weight:900;margin-bottom:14px}
.bad{top:420px;background:rgba(255,90,90,.08);border:2px solid rgba(255,110,110,.35)}
.bad .lb{color:#FF8080}
.bad .tx{font-size:56px;font-weight:900;position:relative;display:inline-block}
.strike{position:absolute;left:-10px;right:-10px;top:52%;height:8px;background:#FF6B6B;transform-origin:left;border-radius:4px}
.good{top:640px;background:rgba(16,201,160,.08);border:2px solid rgba(16,201,160,.4)}
.good .lb{color:#3FE0B8}
.good .tx{font-size:46px;font-weight:700;line-height:1.6}
.hl{background-repeat:no-repeat;background-position:0 88%;background-size:0% 40%;border-radius:4px}
.hl i{font-style:normal}
.lab{display:inline-block;font-size:22px;font-weight:900;padding:2px 12px;border-radius:999px;color:#0A0F1E;vertical-align:super;margin-left:6px}

#bar{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,#4F8CFF,#10C9A0)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <div class="blob" style="background:#2E5BFF;left:-200px;top:-300px"></div>
    <div class="blob" style="background:#10C9A0;right:-300px;top:200px"></div>
    <div class="blob" style="background:#8A5CFF;left:500px;bottom:-500px"></div>
    <div id="grid"></div>
  </div>
  <div id="scenes"></div>
  <div id="bar"></div>
</div>

<script>
const IC = {
  research:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 9h5M8 12h3.5"/>',
  agent:'<circle cx="4.5" cy="12" r="2.5"/><circle cx="12" cy="5" r="2.5"/><circle cx="19.5" cy="12" r="2.5"/><circle cx="12" cy="19" r="2.5"/><path d="M6.3 10.2L10.2 6.8M13.8 6.8l3.9 3.4M17.7 13.8l-3.9 3.4"/>',
  data:'<path d="M3 21h18"/><path d="M6 17v-5M11 17V7M16 17v-8M21 17V4" />',
  project:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M7 13h10M7 16.5h6"/>',
  gpt:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  plug:'<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
  repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  won:'<path d="M3 21h18"/><path d="M5 17l4-5 4 3 6-8"/><path d="M15 7h4v4"/>',
  play:'<rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M10 9.2v5.6l4.8-2.8z"/>',
};
const svg = (k,cls='ic') => `<svg class="${cls}" viewBox="0 0 24 24">${IC[k]}</svg>`;

const F = [
  {n:'심층 리서치', ic:'research', c:'#4F8CFF', k:'근거 있는 보고서',
   d:'여러 출처를 조사하고 서로 비교해 근거가 있는 보고서를 작성합니다.',
   q:'“경쟁사 5곳의 제품·가격·유통망을 조사해 비교해줘.”'},
  {n:'에이전트·Work', ic:'agent', c:'#10C9A0', k:'여러 단계를 결과물까지',
   d:'목표를 주면 조사, 계산, 파일 작성 등 여러 단계를 이어서 처리합니다.',
   q:'“업체를 조사하고 평가표와 미팅 보고서까지 만들어줘.”'},
  {n:'고급 데이터 분석', ic:'data', c:'#F5B83D', k:'엑셀·CSV 분석',
   d:'엑셀·CSV 데이터를 계산하고 추세·이상값·그래프로 분석합니다.',
   q:'“인건비가 증가한 원인을 부서별로 분석해줘.”'},
  {n:'프로젝트', ic:'project', c:'#A47BFF', k:'자료와 대화를 한곳에',
   d:'한 주제의 파일과 대화를 모아 관련 작업에 계속 활용합니다.',
   q:'“유튜브 강의 자료와 회차별 대본을 한곳에서 관리하기.”'},
  {n:'맞춤형 업무 도우미', ic:'gpt', c:'#FF7AA8', k:'같은 기준·같은 형식',
   d:'지침과 참고 자료를 설정해 일정한 방식으로 반복 작업합니다.',
   q:'“회사 양식에 맞춰 회의록을 작성하는 도우미.”'},
  {n:'앱·플러그인 연결', ic:'plug', c:'#36C5F0', k:'연결 서비스 자료 활용',
   d:'연결한 서비스의 자료를 찾고 지원되는 작업을 수행합니다.',
   q:'“연결된 업무 자료에서 특정 업체 관련 내용을 찾아줘.”'},
  {n:'예약 작업', ic:'clock', c:'#FF8A4C', k:'정해진 시간마다 실행',
   d:'지정한 시간이나 주기로 요청한 작업을 실행합니다.',
   q:'“매주 월요일 오전 9시에 업계 뉴스를 정리해줘.”'},
  {n:'코딩·웹 도구 제작', ic:'code', c:'#7BE07B', k:'실제 쓰는 도구 제작',
   d:'프로그램, 웹사이트, 계산기 등 실제 사용할 도구를 만듭니다.',
   q:'“엑셀을 올리면 월별 비용을 비교하는 도구를 만들어줘.”'},
];

// ---------- timeline ----------
const scenes = [];
const add = (dur, html, style='') => {
  const s = scenes.length ? scenes[scenes.length-1].e : 0;
  scenes.push({s, e:s+dur, html, style});
};

// 1. Intro
add(7, `
  <div class="abs center" style="top:230px"><span class="chip" data-fx="up" data-t="0.2">OpenAI 공식 안내 기준 · 실무 활용 가이드</span></div>
  <div class="abs center t-big grad" style="top:330px" data-fx="up" data-t="0.5">ChatGPT</div>
  <div class="abs center t-mid" style="top:500px" data-fx="up" data-t="0.8">고급 기능 한눈에 보기</div>
  <div class="abs center sub" style="top:690px" data-fx="fade" data-t="1.6" data-d="1">깊게 조사하고 · 여러 단계를 처리하고 · 반복 작업을 자동화합니다</div>
  <div class="abs center note" style="top:900px" data-fx="fade" data-t="2.8" data-d="1">※ 기능의 표시 이름과 사용 가능 여부는 요금제·앱·회사 계정 설정에 따라 달라질 수 있습니다</div>
`);

// 2. Pillars
const P = [['research','조사','자료를 깊게 조사','#4F8CFF'],['agent','처리','여러 단계 업무를 처리','#10C9A0'],['repeat','자동화','반복 작업을 자동화','#FF8A4C']];
add(7, `
  <div class="abs center h2" style="top:140px" data-fx="up" data-t="0.2">고급 기능은 이런 일에 씁니다</div>
  ${P.map((p,i)=>`<div class="pillar" style="left:${190+i*530}px" data-fx="pop" data-t="${0.8+i*0.45}">
      <div class="circ" style="background:${p[3]};color:#0A0F1E;box-shadow:0 0 90px -20px ${p[3]}">${svg(p[0])}</div>
      <div class="k">${p[1]}</div><div class="d">${p[2]}</div></div>`).join('')}
  <div class="abs center sub" style="top:880px" data-fx="up" data-t="3.6">지금부터 <span class="grad" style="font-weight:900">8가지 핵심 기능</span>을 하나씩 살펴볼게요</div>
`);

// 3. Features
F.forEach((f,i)=>{
  add(6.6, `
    <div class="abs ftag" data-fx="left" data-t="0.1">고급 기능 ${String(i+1).padStart(2,'0')} / 08</div>
    <div class="abs ficonwrap" data-fx="pop" data-t="0.2"><div class="ring" data-spin="1"></div><div class="ficon">${svg(f.ic)}</div></div>
    <div class="abs fname" data-fx="up" data-t="0.4">${f.n}</div>
    <div class="abs fline" data-fx="growy" data-t="0.3" data-d="1"></div>
    <div class="abs flabel" data-fx="up" data-t="0.7">무엇을 하는 기능인가요?</div>
    <div class="abs fdesc" data-fx="up" data-t="0.85">${f.d}</div>
    <div class="abs chat" data-fx="up" data-t="1.7">
      <div class="who"><i></i>활용 예시 — 이렇게 요청해 보세요</div>
      <div class="bubble"><span class="type" data-t="2.0" data-d="2.4" data-text="${f.q}"></span><span class="caret" data-caret="2.0,5.4"></span></div>
    </div>
    <div class="abs dots">${F.map((_,j)=>`<b class="${j===i?'on':''}"></b>`).join('')}</div>
  `, `--c:${f.c}`);
});

// 4. Overview grid
add(8, `
  <div class="abs center h2" style="top:110px" data-fx="up" data-t="0.1">한눈에 정리</div>
  ${F.map((f,i)=>{const col=i%4,row=Math.floor(i/4);
    return `<div class="tile" style="left:${150+col*420}px;top:${270+row*290}px" data-fx="pop" data-t="${0.4+i*0.12}">
      <div class="ti" style="background:${f.c}">${svg(f.ic)}</div>
      <div class="tn">${f.n}</div><div class="tk">${f.k}</div></div>`}).join('')}
  <div class="summ" data-fx="up" data-t="2.6">
    <div><span style="color:#A47BFF">프로젝트</span> 자료·대화를 이어서</div>
    <div><span style="color:#10C9A0">에이전트</span> 여러 도구로 결과물까지</div>
    <div><span style="color:#FF8A4C">예약 작업</span> 반복 실행이 필요할 때</div>
  </div>
`);

// 5. Distinctions
const D = [
  ['심층 리서치','#4F8CFF','“충분히 조사해서 <em>판단 근거</em>를 만들어줘.”'],
  ['에이전트','#10C9A0','“필요한 단계를 진행해서 <em>결과물까지</em> 만들어줘.”'],
  ['프로젝트','#A47BFF','“이 업무의 자료와 대화를 <em>모아서 계속</em> 작업하자.”'],
  ['맞춤형 도우미','#FF7AA8','“매번 <em>같은 기준과 형식</em>으로 처리해줘.”'],
  ['예약 작업','#FF8A4C','“이 일을 <em>정해진 시간마다</em> 실행해줘.”'],
];
add(13, `
  <div class="abs center h2" style="top:90px" data-fx="up" data-t="0.1">헷갈리기 쉬운 기능, 이렇게 구분하세요</div>
  ${D.map((d,i)=>`<div class="row" style="top:${250+i*140}px" data-fx="left" data-t="${0.9+i*1.5}">
     <div class="pill" style="background:${d[1]}">${d[0]}</div><div class="q muted">${d[2]}</div></div>`).join('')}
  <div class="abs center note" style="top:975px" data-fx="fade" data-t="9" data-d="1">※ 맞춤형 도우미는 계정 환경에 따라 기존 GPTs 또는 플러그인 방식으로 제공될 수 있습니다</div>
`);

// 6. Work fit
const W = [
  ['globe','해외영업·업체 검토','#4F8CFF',['심층 리서치','문서 작성'],'“이 업체의 제품, 유통망, 경쟁력을 조사하고 미팅 질문 10개와 1장 보고서를 만들어줘.”'],
  ['won','인건비 비용계획','#F5B83D',['고급 데이터 분석'],'“계획과 실적 차이를 인원·급여·수당 요인으로 나눠 분석해줘.”'],
  ['play','유튜브·꿀팁ON 운영','#FF7AA8',['프로젝트','맞춤형 도우미'],'“기존 콘텐츠 스타일을 참고해 다음 회차의 대본·썸네일 문구·게시글을 만들어줘.”'],
];
add(15, `
  <div class="abs center h2" style="top:110px" data-fx="up" data-t="0.1">지금 하시는 업무에는 이렇게 활용하세요</div>
  ${W.map((w,i)=>{const t0=2.2+i*3.9;
    return `<div class="card" style="left:${100+i*600}px;--c:${w[2]}" data-fx="up" data-t="${0.6+i*0.3}" data-act="${t0},${t0+3.9}">
      <div class="ci">${svg(w[0])}</div><div class="cn">${w[1]}</div>
      <div class="tags">${w[3].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="cq"><span class="type" data-t="${t0}" data-d="3" data-text="${w[4]}"></span><span class="caret" data-caret="${t0},${t0+3.9}"></span></div></div>`}).join('')}
`);

// 7. Prompt tip
const K = [['목표','#4F8CFF'],['참고 자료','#A47BFF'],['결과물 형식','#F5B83D'],['완료 기준','#10C9A0']];
const hl = (txt, ki, t) => `<span class="hl" data-fx="hl" data-t="${t}" data-d="0.6" style="background-image:linear-gradient(${K[ki][1]}66,${K[ki][1]}66)">${txt}<span class="lab" data-fx="pop" data-t="${t+0.3}" style="background:${K[ki][1]}">${K[ki][0]}</span></span>`;
add(16, `
  <div class="abs center h2" style="top:100px" data-fx="up" data-t="0.1">잘 요청하는 법 — 이 4가지를 함께 알려주세요</div>
  <div class="keys">${K.map((k,i)=>`<div class="key" style="--c:${k[1]}" data-fx="pop" data-t="${0.6+i*0.25}" data-act="${[7.4,6.4,9.6,8.2][i]},${[7.4,6.4,9.6,8.2][i]+1.2}">${k[0]}</div>`).join('')}</div>
  <div class="box bad" data-fx="up" data-t="2.2">
    <div class="lb">✕  이렇게 말하기보다</div>
    <div class="tx">“업체 조사해줘”<div class="strike" data-fx="grow" data-t="3.4" data-d="0.5"></div></div>
  </div>
  <div class="box good" data-fx="up" data-t="4.4">
    <div class="lb">✓  이렇게 요청해 보세요</div>
    <div class="tx">“${hl('공식 자료를 중심으로',1,6.4)} ${hl('업체를 조사하고',0,7.4)}, ${hl('확인되지 않은 내용은 표시해서',3,8.2)} ${hl('팀장 보고용 Word 1장',2,9.6)}으로 만들어줘”</div>
  </div>
`);

// 8. Outro
add(8, `
  <div class="abs center" style="top:200px"><span class="chip" data-fx="up" data-t="0.2">한 줄 요약</span></div>
  <div class="abs center" style="top:310px;font-size:62px;font-weight:900;line-height:1.6" data-fx="up" data-t="0.5">
    조사는 <span style="color:#4F8CFF">심층 리서치</span> · 실행은 <span style="color:#10C9A0">에이전트</span><br>
    축적은 <span style="color:#A47BFF">프로젝트</span> · 반복은 <span style="color:#FF8A4C">예약 작업</span></div>
  <div class="abs center sub" style="top:600px" data-fx="up" data-t="1.6">목표 · 참고 자료 · 결과물 형식 · 완료 기준을 함께 알려주면<br>결과를 <span class="grad" style="font-weight:900">검토하고 활용하기가 훨씬 쉬워집니다</span></div>
  <div class="abs center note" style="top:910px" data-fx="fade" data-t="2.6" data-d="1">출처: OpenAI 공식 안내(ChatGPT Learn) · 기능 이름과 제공 여부는 요금제·앱·계정 설정에 따라 다를 수 있습니다</div>
`);

const TOTAL = scenes[scenes.length-1].e + 0.6;
const root = document.getElementById('scenes');
scenes.forEach(sc=>{
  const d = document.createElement('div');
  d.className='scene'; d.style.cssText=sc.style; d.innerHTML=sc.html;
  sc.el=d; sc.fx=[...d.querySelectorAll('[data-fx]')]; sc.ty=[...d.querySelectorAll('.type')];
  sc.ca=[...d.querySelectorAll('[data-caret]')]; sc.act=[...d.querySelectorAll('[data-act]')]; sc.spin=[...d.querySelectorAll('[data-spin]')];
  sc.ty.forEach(el=>el._chars=[...el.dataset.text]);
  root.appendChild(d);
});

const C = x => Math.max(0, Math.min(1, x));
const eo = p => 1 - Math.pow(1-p, 3);
const back = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
const blobs = [...document.querySelectorAll('.blob')];
const bar = document.getElementById('bar');

function render(t){
  blobs.forEach((b,i)=>{ b.style.transform=`translate(${Math.sin(t*0.18+i*2.1)*220}px,${Math.cos(t*0.13+i*1.3)*160}px)`; });
  bar.style.width = (C(t/TOTAL)*1920)+'px';
  scenes.forEach((sc,idx)=>{
    const el = sc.el;
    if (t < sc.s - 0.001 || t > sc.e + 0.5) { el.style.display='none'; return; }
    el.style.display='block';
    const fi = idx===0 ? C(t/0.4) : C((t-sc.s)/0.5);
    const fo = 1 - C((t-sc.e)/0.5);
    el.style.opacity = Math.min(fi, fo);
    el.style.transform = fo<1 ? `scale(${1+0.05*(1-fo)})` : '';
    el.style.filter = fo<1 ? `blur(${(1-fo)*8}px)` : '';
    const lt = t - sc.s;
    sc.fx.forEach(e=>{
      const t0 = +e.dataset.t||0, d = +(e.dataset.d||0.7);
      const p = C((lt-t0)/d), k = eo(p);
      switch(e.dataset.fx){
        case 'up': e.style.opacity=k; e.style.transform=`translateY(${(1-k)*50}px)`; break;
        case 'left': e.style.opacity=k; e.style.transform=`translateX(${(1-k)*-80}px)`; break;
        case 'fade': e.style.opacity=k; break;
        case 'pop': e.style.opacity=C(p*2); e.style.transform=`scale(${p<=0?0.6:0.6+0.4*back(p)})`; break;
        case 'grow': e.style.transform=`scaleX(${k})`; break;
        case 'growy': e.style.transform=`scaleY(${k})`; break;
        case 'hl': e.style.backgroundSize=`${k*100}% 40%`; break;
      }
    });
    sc.ty.forEach(e=>{
      const p = C((lt-(+e.dataset.t))/(+e.dataset.d));
      const n = Math.round(p*e._chars.length);
      if (e._n!==n){ e.textContent = e._chars.slice(0,n).join(''); e._n=n; }
    });
    sc.ca.forEach(e=>{
      const [a,b]=e.dataset.caret.split(',').map(Number);
      e.style.opacity = (lt>=a && lt<=b && Math.floor(lt*2.5)%2===0) ? 1 : 0;
    });
    sc.act.forEach(e=>{
      const [a,b]=e.dataset.act.split(',').map(Number);
      e.classList.toggle('on', lt>=a && lt<b);
    });
    sc.spin.forEach(e=>{ e.style.transform=`rotate(${lt*30}deg)`; });
  });
}
window.TOTAL = TOTAL; window.render = render;

// live preview when opened in a browser
if (!navigator.webdriver) {
  const st = performance.now();
  const loop = () => { render(((performance.now()-st)/1000) % TOTAL); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
} else { render(0); }
</script>
</body>
</html>
